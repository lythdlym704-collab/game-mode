            }
            void startFg() {
              NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
              Notification.Builder nb;
              if (Build.VERSION.SDK_INT >= 26) { nm.createNotificationChannel(new NotificationChannel("g", "وضع اللعب", NotificationManager.IMPORTANCE_LOW)); nb = new Notification.Builder(this, "g"); }
              else nb = new Notification.Builder(this);
              PendingIntent pi = PendingIntent.getService(this, 0, new Intent(this, OverlayService.class).setAction("stop"), PendingIntent.FLAG_IMMUTABLE);
              Notification n = nb.setContentTitle("وضع اللعب شغّال").setContentText("اضغط هنا للإنهاء ورجوع النت لكل التطبيقات")
                .setSmallIcon(R.drawable.ic_stat).setContentIntent(pi).build();
              if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE); else startForeground(1, n);
            }
          
            /* ---------- الأيقونة العائمة واللوحة ---------- */
            void build() {
              wm = (WindowManager) getSystemService(WINDOW_SERVICE);
              sp = getSharedPreferences("gm", MODE_PRIVATE);
              dark = sp.getInt("dark", 0);
          
              /* طبقة الظلام تضاف أول حتى تبقى تحت الأيقونة واللوحة */
              dim = new View(this);
              dim.setBackgroundColor(dark * 255 / 100 << 24);
              dp2 = new WindowManager.LayoutParams(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT, type(),
                WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, PixelFormat.TRANSLUCENT);
              dp2.gravity = Gravity.TOP | Gravity.START;
              if (Build.VERSION.SDK_INT >= 28) dp2.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
              wm.addView(dim, dp2);
          
              bubble = new Bubble(this);
              bp = new WindowManager.LayoutParams(dp(54), dp(54), type(), WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
              bp.gravity = Gravity.TOP | Gravity.START; bp.x = dp(2); bp.y = dp(160);
              bubble.setOnTouchListener(new View.OnTouchListener() {
                int sx, sy; float tx, ty; boolean moved;
                @Override public boolean onTouch(View v, MotionEvent e) {
                  switch (e.getAction()) {
                    case MotionEvent.ACTION_DOWN: sx = bp.x; sy = bp.y; tx = e.getRawX(); ty = e.getRawY(); moved = false; return true;
                    case MotionEvent.ACTION_MOVE:
                      int dx = (int) (e.getRawX() - tx), dy = (int) (e.getRawY() - ty);
