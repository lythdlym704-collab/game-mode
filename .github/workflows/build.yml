      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GameMode.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GameMode
          path: GameMode.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: وضع اللعب v${{ github.run_number }}
          files: GameMode.apk

