          package com.gameboost.app;
          import android.content.Context;
          import android.graphics.*;
          import android.view.View;
          
          /* أيقونة عائمة بشكل زجاجي: دائرة متدرجة + لمعة فوقانية + حافة مضيئة + يد تحكم مرسومة */
          public class Bubble extends View {
            final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
            final Path gp = new Path(), clip = new Path();
            final RectF rf = new RectF();
            boolean extra = false, pulsing = false;
            long t0 = 0; float d;
            final Runnable anim = new Runnable() { @Override public void run() { invalidate(); if (pulsing) postDelayed(this, 40); } };
          
            public Bubble(Context c) { super(c); d = c.getResources().getDisplayMetrics().density; }
          
            public void setExtra(boolean e) {
              extra = e; pulsing = e; removeCallbacks(anim);
              if (e) { t0 = System.currentTimeMillis(); post(anim); }
              invalidate();
            }
            @Override protected void onDetachedFromWindow() { removeCallbacks(anim); super.onDetachedFromWindow(); }
          
            @Override protected void onDraw(Canvas c) {
              float w = getWidth(), h = getHeight(), cx = w / 2f, cy = h / 2f;
              float R = Math.min(w, h) / 2f * 0.70f;
              int c1 = extra ? 0xFFFFC24A : 0xFF4BE3F2;
              int c2 = extra ? 0xFFFF6A2C : 0xFF4C6FFF;
          
              /* نبضة حول الأيقونة وقت إكسترا */
              if (pulsing) {
                float ph = ((System.currentTimeMillis() - t0) % 1500L) / 1500f;
                p.reset(); p.setAntiAlias(true); p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(2f * d);
                p.setColor(c1); p.setAlpha((int) (130 * (1f - ph)));
                c.drawCircle(cx, cy, R + ph * R * 0.40f, p);
              }
          
              /* هالة خارجية ناعمة */
              p.reset(); p.setAntiAlias(true); p.setStyle(Paint.Style.FILL);
              int in = (c1 & 0x00FFFFFF) | 0x59000000, out = c1 & 0x00FFFFFF;
              p.setShader(new RadialGradient(cx, cy, R * 1.40f, new int[]{in, in, out}, new float[]{0f, 0.64f, 1f}, Shader.TileMode.CLAMP));
              c.drawCircle(cx, cy, R * 1.40f, p);
          
              /* جسم زجاجي متدرج */
              p.setShader(new LinearGradient(cx - R, cy - R, cx + R, cy + R, c1, c2, Shader.TileMode.CLAMP));
              c.drawCircle(cx, cy, R, p);
          
              /* لمعة من فوق */
              c.save();
              clip.reset(); clip.addCircle(cx, cy, R, Path.Direction.CW); c.clipPath(clip);
              p.setShader(new LinearGradient(cx, cy - R, cx, cy + R * 0.25f, 0x73FFFFFF, 0x00FFFFFF, Shader.TileMode.CLAMP));
              c.drawCircle(cx, cy, R, p);
              c.restore();
          
              /* حافة مضيئة */
              p.setShader(null); p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(1.3f * d); p.setColor(0x8CFFFFFF);
              c.drawCircle(cx, cy, R - 0.65f * d, p);
          
              glyph(c, cx, cy, R * 1.10f);
            }
          
            /* يد التحكم: جسم بيضوي، وفتحات الدي-باد والأزرار تبيّن لون الخلفية */
            void glyph(Canvas c, float cx, float cy, float bw) {
              float bh = bw * 0.54f, l = cx - bw / 2f, t = cy - bh / 2f;
              gp.reset(); gp.setFillType(Path.FillType.EVEN_ODD);
              rf.set(l, t, l + bw, t + bh);
              gp.addRoundRect(rf, bh / 2f, bh / 2f, Path.Direction.CW);
              float px = l + bw * 0.30f, th = bh * 0.15f, arm = bh * 0.33f;
              float x0 = px - th, x1 = px + th, y0 = cy - arm, y1 = cy + arm;
              float a0 = px - arm, a1 = px + arm, b0 = cy - th, b1 = cy + th;
              gp.moveTo(x0, y0); gp.lineTo(x1, y0); gp.lineTo(x1, b0); gp.lineTo(a1, b0);
              gp.lineTo(a1, b1); gp.lineTo(x1, b1); gp.lineTo(x1, y1); gp.lineTo(x0, y1);
              gp.lineTo(x0, b1); gp.lineTo(a0, b1); gp.lineTo(a0, b0); gp.lineTo(x0, b0);
              gp.close();
              float br = bh * 0.135f;
              gp.addCircle(l + bw * 0.70f, cy - bh * 0.15f, br, Path.Direction.CW);
              gp.addCircle(l + bw * 0.83f, cy + bh * 0.16f, br, Path.Direction.CW);
              p.setStyle(Paint.Style.FILL); p.setShader(null); p.setColor(0xFF071024);
              c.drawPath(gp, p);
            }
          }
