            int cleanBackgroundCount() {
              ActivityManager am = (ActivityManager) getSystemService(ACTIVITY_SERVICE); int n = 0;
              for (ApplicationInfo a : getPackageManager().getInstalledApplications(0)) {
                if ((a.flags & ApplicationInfo.FLAG_SYSTEM) != 0 || a.packageName.equals(getPackageName()) || a.packageName.equals(pkg)) continue;
                try { am.killBackgroundProcesses(a.packageName); n++; } catch (Exception ignored) {}
              }
              return n;
            }
            void cleanBackground() { int n = cleanBackgroundCount(); Toast.makeText(this, "طلبت تسكير " + n + " تطبيق بالخلفية", Toast.LENGTH_SHORT).show(); }
          
            void endAll() {
              if (block) startService(new Intent(this, BlockVpn.class).setAction("stop"));
              Toast.makeText(this, "انتهى وضع اللعب، رجع النت لكل التطبيقات", Toast.LENGTH_SHORT).show();
              stopSelf();
            }
            @Override public void onDestroy() {
              ui.removeCallbacksAndMessages(null);
              try { if (panelShown) wm.removeView(panel); } catch (Exception ignored) {}
              try { if (bubble != null) wm.removeView(bubble); } catch (Exception ignored) {}
              try { if (dim != null) wm.removeView(dim); } catch (Exception ignored) {}
              super.onDestroy();
            }
          }
